[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "metag"
version = "0.2.0.dev24"
description = "Physics-informed biochemical reaction thermodynamics with auditable states and validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "rdkit",
]

[project.optional-dependencies]
thermal = [
    "ase>=3.26,<4",
]
reference = [
    "equilibrator-api==0.6.0",
]
calibration = [
    "scipy",
    "scikit-learn",
]
qm = [
    "ase>=3.26,<4",
    "fairchem-core @ git+https://github.com/facebookresearch/fairchem.git@645af7d03e91138ef07e51de387316c9e2e152dc#subdirectory=packages/fairchem-core",
    "torch~=2.13.0",
]
qm-legacy = [
    "ase>=3.26,<4",
    "fairchem-core==2.21.0",
    "torch~=2.8.0",
]
test = [
    "ase",
    "pytest",
    "sympy",
]

[project.scripts]
metag = "metag.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["metag*"]

[tool.setuptools.package-data]
metag = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/regression"]
markers = [
    "gpu: requires a CUDA GPU and the UMA runtime",
    "integration: exercises external programs or the full scoring stack",
    "performance: measures throughput or resource use",
]
