# Conda environment for the QM composite pipeline (the "palm" env).
#
#   conda env create -f env.yaml     # creates env "palm"
#   conda activate palm
#
# Two things live OUTSIDE this env:
#   * xtb (GFN2 geometry/Hessian/solvation) is a separate binary — this repo was
#     developed against xtb 6.7.1 in its own env; point scripts at that binary
#     (see env.sh / XTB_BIN). Install with:  conda create -n xtb -c conda-forge xtb=6.7.1
#   * MLIP weights (UMA uma-s-1p2, MACE-POLAR-1) are downloaded separately and
#     placed under models/ — see README. The MACE-POLAR path additionally needs
#     `mace-torch` (pip); UMA is served by fairchem-core below.
#
# Versions are those the results were produced with. torch is the CUDA 12.8
# build (GPU MLIP scoring); on CPU-only hosts install the matching CPU wheel.
name: palm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.3
  - scipy=1.17
  - pandas
  - matplotlib=3.10
  - rdkit=2025.9
  - ase=3.27
  - scikit-learn=1.8
  - pip
  - pip:
      # MLIP: UMA / OMol25 inference
      - fairchem-core==2.13.0
      - torch==2.8.0
      - e3nn==0.6.0
      - torch-geometric==2.7.0
      # MACE-POLAR-1 path (optional; only if scoring with MACE rather than UMA)
      # - mace-torch
